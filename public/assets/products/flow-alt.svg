<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Botella Flow detalle de hidratación">
  <defs>
    <radialGradient id="dark" cx=".5" cy=".4" r=".85">
      <stop offset="0" stop-color="#1e2b23"/><stop offset="1" stop-color="#0b100e"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9e3d4"/><stop offset=".5" stop-color="#f4f1e8"/><stop offset="1" stop-color="#b9c9b8"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#dark)"/>
  <circle cx="500" cy="470" r="300" fill="#c9f25a" opacity=".16" filter="url(#blur)"/>
  <circle cx="500" cy="500" r="290" fill="none" stroke="#c9f25a" stroke-opacity=".18"/>
  <g transform="rotate(12 500 500)">
    <rect x="410" y="220" width="180" height="540" rx="88" fill="url(#bottle)"/>
    <rect x="440" y="168" width="120" height="76" rx="24" fill="#1a2420"/>
    <rect x="432" y="300" width="26" height="380" rx="13" fill="#fcfbf7" opacity=".6"/>
    <text x="500" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="18" letter-spacing="6" fill="#0b100e">AUREA</text>
    <text x="500" y="524" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="8" letter-spacing="4" fill="#5c6a61">FLOW</text>
  </g>
  <g fill="#c9f25a" opacity=".7">
    <circle cx="230" cy="280" r="6"/><circle cx="790" cy="320" r="4"/><circle cx="800" cy="720" r="6"/><circle cx="200" cy="720" r="3"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
