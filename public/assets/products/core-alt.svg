<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Core Band, detalle de resistencias">
  <defs>
    <radialGradient id="dark" cx=".5" cy=".45" r=".85">
      <stop offset="0" stop-color="#232d22"/><stop offset="1" stop-color="#0a0f0b"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#dark)"/>
  <circle cx="500" cy="500" r="320" fill="#c9f25a" opacity=".12" filter="url(#blur)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M120 700C300 300 640 260 880 380" stroke="#c9f25a" stroke-width="44" opacity=".95"/>
    <path d="M120 600C320 260 660 220 880 300" stroke="#a9bfae" stroke-width="38" opacity=".85"/>
    <path d="M120 800C300 380 620 340 880 460" stroke="#c99f79" stroke-width="34" opacity=".8"/>
    <path d="M120 500C340 220 660 190 880 220" stroke="#fcfbf7" stroke-width="26" opacity=".55"/>
  </g>
  <g fill="#0b100e" opacity=".35">
    <circle cx="230" cy="610" r="26"/><circle cx="420" cy="380" r="20"/><circle cx="700" cy="380" r="22"/>
  </g>
  <text x="500" y="890" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="8" fill="#a9bfae">CORE BAND</text>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
