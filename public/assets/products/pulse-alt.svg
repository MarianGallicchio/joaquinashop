<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Detalle del cabezal Pulse Pro">
  <defs>
    <radialGradient id="dark" cx=".5" cy=".4" r=".9">
      <stop offset="0" stop-color="#25322b"/><stop offset="1" stop-color="#0b100e"/>
    </radialGradient>
    <radialGradient id="lime" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#dcff8a"/><stop offset=".6" stop-color="#c9f25a"/><stop offset="1" stop-color="#9ec72f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b9a90"/><stop offset=".5" stop-color="#36443c"/><stop offset="1" stop-color="#131c17"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#dark)"/>
  <circle cx="500" cy="500" r="330" fill="#c9f25a" opacity=".12" filter="url(#blur)"/>
  <g>
    <circle cx="500" cy="480" r="300" fill="url(#ring)"/>
    <circle cx="500" cy="480" r="248" fill="#111915"/>
    <circle cx="500" cy="480" r="222" fill="none" stroke="#c9f25a" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="500" cy="480" r="186" fill="url(#lime)"/>
    <circle cx="500" cy="480" r="132" fill="#0f1713"/>
    <circle cx="500" cy="480" r="90" fill="#c9f25a" opacity=".92"/>
    <circle cx="500" cy="480" r="46" fill="#111915"/>
    <path d="M406 352a180 180 0 0 1 188 0" fill="none" stroke="#fcfbf7" stroke-opacity=".28" stroke-width="10" stroke-linecap="round"/>
    <g fill="#fcfbf7" opacity=".5">
      <circle cx="210" cy="250" r="4"/><circle cx="790" cy="270" r="5"/><circle cx="830" cy="520" r="3"/><circle cx="190" cy="620" r="3"/>
    </g>
    <text x="500" y="900" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="8" fill="#a9bfae">PULSE PRO</text>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
