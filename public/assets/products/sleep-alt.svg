<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Sleep Mask con compresa térmica">
  <defs>
    <radialGradient id="dark" cx=".5" cy=".45" r=".85">
      <stop offset="0" stop-color="#1c2732"/><stop offset="1" stop-color="#090e12"/>
    </radialGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5850"/><stop offset=".6" stop-color="#202b25"/><stop offset="1" stop-color="#101814"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#dark)"/>
  <circle cx="500" cy="430" r="300" fill="#c9f25a" opacity=".13" filter="url(#blur)"/>
  <path d="M760 190a150 150 0 1 1-118 238 120 120 0 0 0 118-238z" fill="#c9f25a" opacity=".8"/>
  <g fill="#fcfbf7" opacity=".6">
    <circle cx="230" cy="300" r="4"/><circle cx="300" cy="210" r="2.5"/><circle cx="820" cy="500" r="3"/><circle cx="180" cy="520" r="3"/>
  </g>
  <g transform="rotate(-6 500 520)">
    <rect x="140" y="470" width="720" height="110" rx="55" fill="#c9bfa9" opacity=".85"/>
    <path d="M260 440h480c30 0 50 20 50 50v90c0 62-50 110-112 110H322c-62 0-112-48-112-110v-90c0-30 20-50 50-50z" fill="url(#mask)"/>
    <rect x="300" y="490" width="400" height="50" rx="25" fill="#0b100e" opacity=".45"/>
    <rect x="452" y="610" width="96" height="20" rx="10" fill="#c9f25a" opacity=".85"/>
    <text x="500" y="700" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="7" fill="#a9bfae">SLEEP MASK</text>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
