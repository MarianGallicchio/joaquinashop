<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Kit de bandas elásticas AUREA Core Band">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf0e2"/><stop offset=".55" stop-color="#e0e8d6"/><stop offset="1" stop-color="#cdd9c2"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcff8a"/><stop offset="1" stop-color="#a8d62f"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9cbb9"/><stop offset="1" stop-color="#7e9a82"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0b18b"/><stop offset="1" stop-color="#b57550"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="800" cy="220" r="260" fill="#c9f25a" opacity=".3"/>
  <ellipse cx="500" cy="760" rx="300" ry="48" fill="#31402f" opacity=".14" filter="url(#soft)"/>
  <g transform="rotate(-14 500 500)">
    <ellipse cx="410" cy="500" rx="210" ry="94" fill="none" stroke="url(#clay)" stroke-width="30"/>
    <ellipse cx="480" cy="500" rx="210" ry="94" fill="none" stroke="url(#sage)" stroke-width="30"/>
    <ellipse cx="560" cy="500" rx="210" ry="94" fill="none" stroke="url(#lime)" stroke-width="30"/>
    <ellipse cx="470" cy="500" rx="150" ry="52" fill="none" stroke="#fcfbf7" stroke-width="20"/>
  </g>
  <g transform="rotate(18 720 640)">
    <rect x="690" y="600" width="150" height="44" rx="22" fill="#1b2520"/>
    <rect x="704" y="612" width="122" height="8" rx="4" fill="#fcfbf7" opacity=".2"/>
    <rect x="808" y="600" width="32" height="44" rx="16" fill="#c9f25a"/>
  </g>
  <g fill="#0b100e" opacity=".28">
    <circle cx="240" cy="250" r="4"/><circle cx="300" cy="300" r="2.5"/><circle cx="820" cy="760" r="4"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
