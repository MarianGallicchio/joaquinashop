<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Reset Roller textura de liberación">
  <defs>
    <radialGradient id="dark" cx=".5" cy=".45" r=".8">
      <stop offset="0" stop-color="#2a241f"/><stop offset="1" stop-color="#100d0b"/>
    </radialGradient>
    <radialGradient id="clay" cx=".4" cy=".4" r=".6">
      <stop offset="0" stop-color="#e3b18a"/><stop offset=".7" stop-color="#b57550"/><stop offset="1" stop-color="#8c5233"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="7" fill="#0b100e" opacity=".22"/>
      <circle cx="35" cy="35" r="5" fill="#0b100e" opacity=".16"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#dark)"/>
  <circle cx="500" cy="500" r="320" fill="#c9f25a" opacity=".12" filter="url(#blur)"/>
  <circle cx="500" cy="500" r="300" fill="url(#clay)"/>
  <circle cx="500" cy="500" r="300" fill="url(#dots)"/>
  <circle cx="500" cy="500" r="228" fill="none" stroke="#fcfbf7" stroke-opacity=".2" stroke-width="2"/>
  <circle cx="500" cy="500" r="150" fill="#241c17" opacity=".35"/>
  <circle cx="500" cy="500" r="96" fill="#111815"/>
  <circle cx="500" cy="500" r="38" fill="#c9f25a"/>
  <path d="M290 330a300 300 0 0 1 210-80" fill="none" stroke="#fcfbf7" stroke-opacity=".35" stroke-width="12" stroke-linecap="round"/>
  <text x="500" y="890" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="8" fill="#d9c4ae">RESET ROLLER</text>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
