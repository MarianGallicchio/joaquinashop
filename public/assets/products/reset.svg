<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Foam roller vibratorio AUREA Reset Roller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6da"/><stop offset=".6" stop-color="#e6d8c8"/><stop offset="1" stop-color="#d9c4ae"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a077"/><stop offset=".5" stop-color="#be7f58"/><stop offset="1" stop-color="#9c5f3d"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b352f"/><stop offset="1" stop-color="#111815"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="210" cy="220" r="260" fill="#c9f25a" opacity=".25"/>
  <ellipse cx="505" cy="730" rx="330" ry="55" fill="#5b3d2b" opacity=".18" filter="url(#soft)"/>
  <g transform="rotate(-22 500 500)">
    <rect x="220" y="410" width="560" height="180" rx="90" fill="url(#clay)"/>
    <ellipse cx="780" cy="500" rx="42" ry="90" fill="#8d5233"/>
    <ellipse cx="780" cy="500" rx="30" ry="74" fill="#2a211b" opacity=".55"/>
    <ellipse cx="220" cy="500" rx="42" ry="90" fill="#e0ad84"/>
    <rect x="300" y="420" width="400" height="16" rx="8" fill="#fcfbf7" opacity=".22"/>
    <rect x="420" y="410" width="26" height="180" fill="#0b100e" opacity=".14"/>
    <g fill="#0b100e" opacity=".18">
      <circle cx="300" cy="470" r="9"/><circle cx="360" cy="530" r="9"/><circle cx="430" cy="460" r="9"/>
      <circle cx="500" cy="535" r="9"/><circle cx="570" cy="465" r="9"/><circle cx="640" cy="530" r="9"/>
    </g>
    <rect x="690" y="452" width="60" height="96" rx="30" fill="url(#cap)"/>
    <circle cx="720" cy="500" r="9" fill="#c9f25a"/>
  </g>
  <g fill="#0b100e" opacity=".25">
    <circle cx="790" cy="250" r="5"/><circle cx="840" cy="300" r="3"/><circle cx="170" cy="700" r="4"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
