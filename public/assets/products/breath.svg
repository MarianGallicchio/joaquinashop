<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Entrenador de respiración AUREA Breath">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6ede5"/><stop offset=".55" stop-color="#d8e5dc"/><stop offset="1" stop-color="#c5d7cc"/>
    </linearGradient>
    <radialGradient id="pebble" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#adc4b3"/><stop offset=".5" stop-color="#7f9c86"/><stop offset="1" stop-color="#55705e"/>
    </radialGradient>
    <radialGradient id="led" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#e8ffb0"/><stop offset="1" stop-color="#c9f25a"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="220" cy="240" r="240" fill="#c9f25a" opacity=".3"/>
  <ellipse cx="500" cy="720" rx="240" ry="42" fill="#1f3128" opacity=".16" filter="url(#soft)"/>
  <g>
    <path d="M500 250c130 0 236 105 236 226 0 134-90 218-236 218S264 610 264 476c0-121 106-226 236-226z" fill="url(#pebble)"/>
    <path d="M356 400c40-52 100-82 172-82" fill="none" stroke="#fcfbf7" stroke-opacity=".3" stroke-width="14" stroke-linecap="round"/>
    <circle cx="500" cy="490" r="84" fill="none" stroke="#0b100e" stroke-opacity=".2" stroke-width="2"/>
    <circle cx="500" cy="490" r="58" fill="none" stroke="#0b100e" stroke-opacity=".3" stroke-width="2"/>
    <circle cx="500" cy="490" r="30" fill="#0e1713" opacity=".7"/>
    <circle cx="500" cy="490" r="12" fill="url(#led)"/>
    <circle cx="636" cy="590" r="7" fill="#c9f25a"/>
    <text x="500" y="620" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="5" fill="#fcfbf7" opacity=".55">AUREA</text>
  </g>
  <g fill="#0b100e" opacity=".25">
    <circle cx="800" cy="250" r="5"/><circle cx="840" cy="300" r="3"/><circle cx="190" cy="680" r="4"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
