<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Antifaz de descanso AUREA Sleep Mask">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ece7db"/><stop offset=".55" stop-color="#e2dbcc"/><stop offset="1" stop-color="#d3c9b6"/>
    </linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37423b"/><stop offset=".55" stop-color="#1b2420"/><stop offset="1" stop-color="#0e1512"/>
    </linearGradient>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9bfa9"/><stop offset=".5" stop-color="#e8e0cf"/><stop offset="1" stop-color="#b8ac95"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
