<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Botella térmica AUREA Flow 750 ml">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4ebe0"/><stop offset=".6" stop-color="#d6e3d4"/><stop offset="1" stop-color="#c3d5c4"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5f7d65"/><stop offset=".35" stop-color="#86a189"/><stop offset=".62" stop-color="#9db6a0"/><stop offset="1" stop-color="#69866e"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36433c"/><stop offset="1" stop-color="#151d19"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfbf7"/><stop offset="1" stop-color="#ece7d9"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".05"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="780" cy="760" r="280" fill="#c9f25a" opacity=".28"/>
  <ellipse cx="500" cy="800" rx="210" ry="40" fill="#1d2b23" opacity=".18" filter="url(#soft)"/>
  <g>
    <rect x="430" y="196" width="140" height="96" rx="30" fill="url(#cap)"/>
    <rect x="452" y="212" width="96" height="12" rx="6" fill="#fcfbf7" opacity=".14"/>
    <rect x="388" y="278" width="224" height="502" rx="104" fill="url(#bottle)"/>
    <rect x="404" y="300" width="26" height="440" rx="13" fill="#fcfbf7" opacity=".22"/>
    <rect x="576" y="320" width="18" height="410" rx="9" fill="#0b100e" opacity=".12"/>
    <rect x="416" y="420" width="168" height="168" rx="14" fill="url(#label)"/>
    <text x="500" y="470" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="7" fill="#0b100e">AUREA</text>
    <line x1="448" y1="486" x2="552" y2="486" stroke="#0b100e" stroke-opacity=".25"/>
    <text x="500" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3" fill="#5c6a61">FLOW · 750 ML</text>
    <g transform="translate(500 552)">
      <circle r="15" fill="none" stroke="#0b100e" stroke-opacity=".3"/>
      <path d="M0-7c4 5 7 8 7 12a7 7 0 0 1-14 0c0-4 3-7 7-12z" fill="#0b100e" opacity=".4"/>
    </g>
    <rect x="388" y="740" width="224" height="12" fill="#0b100e" opacity=".1"/>
  </g>
  <g fill="#0b100e" opacity=".28">
    <circle cx="770" cy="260" r="4"/><circle cx="820" cy="315" r="2.5"/><circle cx="210" cy="700" r="4"/>
  </g>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".6"/>
</svg>
