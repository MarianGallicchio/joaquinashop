<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="Masajeador de percusión AUREA Pulse Pro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe7da"/><stop offset=".55" stop-color="#dfe8d9"/><stop offset="1" stop-color="#cfdcc8"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4640"/><stop offset=".45" stop-color="#1c2621"/><stop offset="1" stop-color="#0e1512"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75847b"/><stop offset=".5" stop-color="#39463f"/><stop offset="1" stop-color="#1b2520"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c9f25a" stop-opacity=".9"/><stop offset="1" stop-color="#c9f25a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g" result="g2"><feFuncA type="linear" slope=".06"/></feComponentTransfer>
      <feComposite in="g2" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="790" cy="210" r="310" fill="url(#glow)"/>
  <ellipse cx="500" cy="790" rx="300" ry="52" fill="#0b100e" opacity=".13" filter="url(#soft)"/>
  <g transform="rotate(-17 500 500)">
    <rect x="330" y="382" width="360" height="132" rx="66" fill="url(#body)"/>
    <rect x="350" y="398" width="300" height="18" rx="9" fill="#fcfbf7" opacity=".1"/>
    <rect x="596" y="386" width="86" height="124" rx="40" fill="url(#metal)"/>
    <circle cx="300" cy="448" r="86" fill="url(#metal)"/>
    <circle cx="300" cy="448" r="64" fill="#0f1613"/>
    <circle cx="300" cy="448" r="52" fill="url(#glow)"/>
    <circle cx="300" cy="448" r="34" fill="#c9f25a"/>
    <circle cx="286" cy="434" r="10" fill="#fcfbf7" opacity=".5"/>
    <g transform="rotate(19 508 505)">
      <rect x="454" y="452" width="112" height="280" rx="56" fill="url(#body)"/>
      <rect x="454" y="590" width="112" height="16" fill="#c9f25a" opacity=".9"/>
      <rect x="470" y="470" width="16" height="230" rx="8" fill="#fcfbf7" opacity=".08"/>
      <rect x="458" y="700" width="104" height="26" rx="13" fill="#c9f25a"/>
    </g>
    <rect x="420" y="424" width="98" height="26" rx="13" fill="#fcfbf7" opacity=".92"/>
    <text x="469" y="443" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3" text-anchor="middle" fill="#0b100e">AUREA</text>
    <circle cx="600" cy="445" r="7" fill="#c9f25a"/>
  </g>
  <circle cx="770" cy="690" r="7" fill="#0b100e" opacity=".3"/>
  <circle cx="805" cy="655" r="4" fill="#0b100e" opacity=".2"/>
  <rect width="1000" height="1000" filter="url(#grain)" opacity=".55"/>
</svg>
